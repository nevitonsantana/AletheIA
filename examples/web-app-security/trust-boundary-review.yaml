      category: client_owned_critical_logic
      severity: high
      evidence_refs:
        - SRC-CLIENT-CHECKOUT-001
      required_action: human_review_required
    - id: WAS-FINDING-002
      category: cross_tenant_context
      severity: high
      evidence_refs:
        - SRC-TENANT-CONTEXT-001
      required_action: block_until_authoritative_scoping_exists
  decision:
